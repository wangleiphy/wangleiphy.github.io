<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <!-- Modern drop shadow (matching agent-loop.svg) -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient for the LLM (matching agent-loop.svg) -->
    <linearGradient id="llmGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="320" fill="#fafafa" rx="12"/>

  <!-- Layer 3: User-provided Contexts (Outer) -->
  <rect x="40" y="30" width="420" height="260" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="8 4" filter="url(#softShadow)"/>
  <text x="60" y="58" fill="#1e40af" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">User Contexts</text>
  <text x="60" y="76" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11">CLAUDE.md, Skills, Prompts, ...</text>

  <!-- Layer 2: Agent System (Middle) -->
  <rect x="80" y="100" width="340" height="160" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="100" y="128" fill="#a16207" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Agent System (Cursor, Claude Code, Codex, ...)</text>
  <text x="100" y="146" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tools, Memory, Planning, Feedback Loop</text>

  <!-- Layer 1: LLM (Inner) -->
  <rect x="120" y="170" width="260" height="70" rx="12" fill="url(#llmGradient)" filter="url(#softShadow)"/>
  <text x="250" y="212" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">LLM</text>

</svg>
