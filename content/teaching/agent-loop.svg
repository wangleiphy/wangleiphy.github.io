<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 310">
  <defs>
    <!-- Modern drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient for the Agent -->
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="650" height="310" fill="#fafafa" rx="12"/>

  <!-- The Agent Loop - positioned below everything -->
  <ellipse cx="325" cy="165" rx="280" ry="125" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- Tool Nodes - arranged around the agent -->

  <!-- Memory Node (left) -->
  <rect x="30" y="130" width="100" height="55" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="80" y="158" text-anchor="middle" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Memory</text>
  <text x="80" y="174" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="10">Context</text>

  <!-- Shell Node (right) -->
  <rect x="520" y="130" width="100" height="55" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="570" y="158" text-anchor="middle" fill="#a16207" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Shell</text>
  <text x="570" y="174" text-anchor="middle" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="10">Commands</text>

  <!-- Files Node (bottom left) -->
  <rect x="120" y="235" width="100" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="170" y="263" text-anchor="middle" fill="#1e40af" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Files</text>
  <text x="170" y="279" text-anchor="middle" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Read / Write</text>

  <!-- Web Node (bottom right) -->
  <rect x="430" y="235" width="100" height="55" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="480" y="263" text-anchor="middle" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Web</text>
  <text x="480" y="279" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Search / Fetch</text>

  <!-- Connection lines -->
  <line x1="130" y1="157" x2="205" y2="157" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="445" y1="157" x2="520" y2="157" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="200" x2="185" y2="235" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="200" x2="465" y2="235" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- The LLM Central Unit -->
  <rect x="215" y="115" width="220" height="90" rx="16" fill="url(#agentGradient)" filter="url(#softShadow)"/>
  <text x="325" y="165" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">LLM</text>

  <!-- User Node (top) -->
  <rect x="265" y="25" width="120" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="325" y="50" text-anchor="middle" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">User</text>
  <text x="325" y="66" text-anchor="middle" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10">Goals / Feedback</text>

  <!-- User to Agent arrow -->
  <line x1="325" y1="75" x2="325" y2="110" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>
