  - main [ref=f4e10]:
    - generic [ref=f4e12]:
      - heading "AI Agents and Your Research" [level=1] [ref=f4e13]
      - paragraph [ref=f4e14]:
        - emphasis [ref=f4e15]: Lei Wang and AI agents
      - paragraph [ref=f4e16]:
        - emphasis [ref=f4e17]: January 2026
      - separator [ref=f4e18]
      - paragraph [ref=f4e19]: "AI agents are transforming scientific research in unprecedented ways. Among many things, vibe coding is particularly relevant to computational physics research. The way we work—and what we should focus on—is changing rapidly. In this note, I'll share some practical experiences and thoughts with you: graduate students at IOP."
      - heading "From Chatbot to Agent" [level=2] [ref=f4e20]
      - paragraph [ref=f4e21]: A Large Language Model (LLM) is an autoregressive generative model for text tokens. Given a sequence of tokens, it predicts the probability distribution of the next token, samples from that distribution, appends the new token, and repeats. This simple loop generates coherent text one token at a time.
      - paragraph [ref=f4e22]:
        - text: Mathematically, this amounts to sampling the response
        - generic [ref=f4e24]:
          - math [ref=f4e26]:
            - generic [ref=f4e27]: "y"
          - generic [ref=f4e30]: "y"
        - text: from the conditional distribution
        - generic [ref=f4e33]:
          - math [ref=f4e35]:
            - generic [ref=f4e37]:
              - generic [ref=f4e38]:
                - generic [ref=f4e39]: p
                - generic [ref=f4e40]: θ
              - generic [ref=f4e41]: (
              - generic [ref=f4e42]: "y"
              - generic [ref=f4e43]: ∣
              - generic [ref=f4e44]: x
              - generic [ref=f4e45]: )
          - generic [ref=f4e47]:
            - generic [ref=f4e48]:
              - text: p
              - generic [ref=f4e49]: θ
            - text: (y∣x)
        - text: . Here,
        - generic [ref=f4e59]:
          - math [ref=f4e61]:
            - generic [ref=f4e62]: θ
          - generic [ref=f4e65]: θ
        - text: denotes the model parameters—there can be hundreds of billions of them, encoding a
        - link "blurry compression" [ref=f4e67] [cursor=pointer]:
          - /url: https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web
        - text: of the training data. What you can control is the
        - strong [ref=f4e68]: context
        - generic [ref=f4e70]:
          - math [ref=f4e72]:
            - generic [ref=f4e73]: x
          - generic [ref=f4e76]: x
        - text: ": those tokens the model can \"see\" when making the prediction. This context has a finite size (the \"context window\"—ranging from thousands to millions of tokens in modern models). Everything the model knows about your task must fit in this window: your question, relevant background, previous conversation turns, and any documents you've provided. Crucially,"
        - strong [ref=f4e78]: the LLM has no persistent state
        - text: —each conversation starts fresh, and it cannot verify whether its outputs are correct. It simply predicts what tokens are likely to come next, based on patterns learned during training.
      - paragraph [ref=f4e79]:
        - text: An
        - strong [ref=f4e80]: AI agent
        - text: "extends the raw LLM to address these limitations:"
      - code [ref=f4e82]: Agent = LLM + Tools + Memory + Feedback
      - list [ref=f4e83]:
        - listitem [ref=f4e84]:
          - strong [ref=f4e85]: Tools
          - text: ": Interact with the environment—read/write files, execute code, search the web, run tests"
        - listitem [ref=f4e86]:
          - strong [ref=f4e87]: Memory
          - text: ": Manage context within sessions and persist knowledge across sessions"
        - listitem [ref=f4e88]:
          - strong [ref=f4e89]: Feedback
          - text: ": Observe outcomes, verify against reality, decide next steps, iterate toward a goal"
      - paragraph [ref=f4e90]:
        - text: The key is the
        - strong [ref=f4e91]: reflection cycle
        - text: ":"
        - strong [ref=f4e92]: Observe → Reason → Act → Verify → Repeat
        - text: .
      - paragraph [ref=f4e93]:
        - img "Agent Loop" [ref=f4e94]
      - paragraph [ref=f4e95]:
        - text: Unlike a chatbot that responds once and waits, an agent operates in a loop. After taking an action, it observes the result (Did the code run? Did the test pass? What error appeared?), reasons about what to do next, and continues. This is where
        - strong [ref=f4e96]: verification
        - text: "enters: the agent can check its own work by running tests, examining outputs, or comparing against expected results."
        - strong [ref=f4e97]: Context management
        - text: "also becomes crucial—the agent must decide what information to keep in its limited context window: the current goal, execution plan, relevant code, error messages, and lessons learned. This observe-act-verify loop, combined with careful context management, is what transforms a one-shot predictor into something that can actually"
        - emphasis [ref=f4e98]: get things done
        - text: .
      - heading "What Can Agents Do for Your Research?" [level=2] [ref=f4e99]
      - paragraph [ref=f4e100]: "Current AI agents (Cursor, Claude Code, Codex, etc) are remarkably useful for computational research. Here's what they can help with:"
      - list [ref=f4e101]:
        - listitem [ref=f4e102]:
          - strong [ref=f4e103]: Onboarding
          - text: ": Read papers, code, and documentation to quickly understand a topic"
        - listitem [ref=f4e104]:
          - strong [ref=f4e105]: Brainstorming
          - text: ": Explore different approaches and catch edge cases you might miss"
        - listitem [ref=f4e106]:
          - strong [ref=f4e107]: Prototyping
          - text: ": Setup programming environment, write code fast, iterate until it works"
        - listitem [ref=f4e108]:
          - strong [ref=f4e109]: Monitoring
          - text: ": Babysit jobs, parse logs, restart on failure"
        - listitem [ref=f4e110]:
          - strong [ref=f4e111]: Analysis
          - text: ": Compute statistics, analyse results via different angles"
        - listitem [ref=f4e112]:
          - strong [ref=f4e113]: Reporting
          - text: ": Summarize research logs"
      - paragraph [ref=f4e114]: "Let's see this in action with three examples, one from each stage of research: reading, computing, and writing."
      - paragraph [ref=f4e115]:
        - strong [ref=f4e116]: Reading papers.
        - text: You can simply ask an LLM to pick out papers for you from the daily arXiv listing. But the recommendations get much better once you teach it your taste—either softly, by describing your interests in natural language, or programmatically, by letting the agent build a tool for you. For example, the
        - link "paper_recommender" [ref=f4e117] [cursor=pointer]:
          - /url: https://github.com/wangleiphy/paper_recommender/
        - text: "built with an AI agent does the latter: it embeds the papers I have tagged as favorites together with my own arXiv papers, and recommends new papers by semantic similarity. AI agents allow customization: you can easily build the recommender to express your wish."
      - paragraph [ref=f4e118]:
        - strong [ref=f4e119]: Running simulations.
        - text: As an exercise, we ask an agent to run Sandvik's stochastic series expansion (SSE) code
        - link "ssebasic.f90" [ref=f4e120] [cursor=pointer]:
          - /url: https://physics.bu.edu/~sandvik/vietri/sse/ssebasic.f90
        - text: "for the 2D Heisenberg antiferromagnet. A subtle compiler-related bug sneaks into the random number generator: the code compiles cleanly, yet silently produces wrong results. What saves the day is that the code comes with detailed"
        - link "documentation" [ref=f4e121] [cursor=pointer]:
          - /url: https://physics.bu.edu/~sandvik/programs/ssebasic/ssebasic.html
        - text: and published
        - link "benchmark results" [ref=f4e122] [cursor=pointer]:
          - /url: https://physics.bu.edu/~sandvik/vietri/sse/results.html
        - text: —the former gives the agent the context to understand the program, and the latter lets it verify the outputs and catch the bug. Contexts and benchmarks are as valuable as the code itself.
      - paragraph [ref=f4e123]:
        - strong [ref=f4e124]: Writing papers.
        - text: Given enough context—research notes, code, and results—current models can produce a decent paper draft in one shot. Nevertheless, skills distilled from experienced researchers, such as this
        - link "paper-review-checklist" [ref=f4e125] [cursor=pointer]:
          - /url: https://github.com/QuantumBFS/claude-code-skills/tree/main/plugins/paper-review-checklist
        - text: ", still sharpen the draft. Moreover, a fresh-eyes reviewer—a subagent that reads the draft without any of the conversation context—catches the common error of notation used before it is defined, and helps to tune the presentation."
      - heading "Working Effectively with AI Agents" [level=2] [ref=f4e126]
      - paragraph [ref=f4e127]: To get the most out of AI agents, some engineering practices are useful. Then, you can build up good interaction habits. Let me share what I've learned.
      - heading "Engineering Practices" [level=3] [ref=f4e128]
      - paragraph [ref=f4e129]:
        - text: Agile development encompasses several core engineering practices—documentation, automated testing, and version control—woven into iterative development cycles.
        - superscript [ref=f4e130]:
          - link "1" [ref=f4e131] [cursor=pointer]:
            - /url: "#footnote-1"
        - text: In the era of AI agents, these practices become even more essential, but for interesting new reasons.
      - paragraph [ref=f4e132]:
        - strong [ref=f4e133]: Test-Driven Development (TDD)—verifications for AI.
        - text: Traditionally, TDD ensures code correctness by writing tests before implementation—catching bugs early and enabling confident refactoring. With AI agents, this practice becomes even more critical. AI-generated code is not automatically correct; the only way to trust it is to
        - strong [ref=f4e134]: test it
        - text: ". Tests are where the feedback term becomes concrete: they are the signal the agent loops on, and writing them well is how you decide what \"correct\" means. You can build confidence and trust in AI incrementally: unit tests for functions, integration tests for modules, end-to-end tests for the full pipeline, and validation against known benchmarks."
      - paragraph [ref=f4e135]:
        - strong [ref=f4e136]: Documentation — context for Humans AND AI.
        - text: "In Agile, documentation keeps team members aligned on project structure, workflows, and conventions. With AI agents, documentation takes on a new role: it becomes the AI's long-term memory. Documents such as"
        - code [ref=f4e137]: CLAUDE.md
        - text: tell the AI agent about project goals, key files, and gotchas. AI reads those files to provide contexts in future sessions.
      - paragraph [ref=f4e138]:
        - strong [ref=f4e139]: Version Control — Your Safety Net.
        - text: Git has always been essential for tracking changes and enabling collaboration. With AI agents, it becomes your safety net. The agent will make mistakes—it will sometimes break things. Frequent commits let you easily roll back when something goes wrong. Branches let you explore experimental approaches without risk. Via version control, both you and AI always have a clear history of what has changed and why.
      - paragraph [ref=f4e140]:
        - text: Overall, I find the advice in the timeless
        - link "The Pragmatic Programmer" [ref=f4e141] [cursor=pointer]:
          - /url: https://www.amazon.com/Pragmatic-Programmer-journey-mastery-Anniversary/dp/0135957052
        - text: is still (perhaps even more) relevant with AI agents. Check Jinguo Liu's
        - link "blog posts" [ref=f4e142] [cursor=pointer]:
          - /url: https://www.jinguo-group.science/Blogs/
        - text: for more practical instructions on these topics.
      - heading "Interaction Habits" [level=3] [ref=f4e143]
      - paragraph [ref=f4e144]:
        - text: Despite what folklore suggests, LLMs and the agents built around them are not truly "black boxes"—both can be understood.
        - link "This tutorial" [ref=f4e145] [cursor=pointer]:
          - /url: https://wangleiphy.github.io/talks.html#aaa-hangzhou2025
        - text: explains how autoregressive generative models work, while
        - link "learn-claude-code" [ref=f4e146] [cursor=pointer]:
          - /url: https://github.com/shareAI-lab/learn-claude-code
        - text: shows how to build an agent from scratch in ~50 lines of code. Understanding these mechanisms reveals good habits for using AI agents effectively.
      - paragraph [ref=f4e147]:
        - strong [ref=f4e148]: From "?" to "!".
        - text: "You can always start by asking questions—either to gain understanding yourself or to provide AI agents the necessary context. This step also aligns and calibrates the AI system: if things go wrong, it may already show up in this step. Some AI agents have an explicit \"Ask\" mode—use it. Once you are confident about yourself and the agent, you can send imperative commands to let AI complete tasks."
      - paragraph [ref=f4e149]:
        - strong [ref=f4e150]: Build step by step.
        - text: Start small, verify, then expand—each step testable before moving to the next. This mirrors
        - link "Chain-of-Thought (CoT)" [ref=f4e151] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2201.11903
        - text: prompting, where "think step by step" improves LLM reasoning. Agent-level planning is the same principle at larger scale.
      - paragraph [ref=f4e152]:
        - strong [ref=f4e153]: Learn from mistakes.
        - text: "AI will make errors—this is expected. But don't just retry blindly. Diagnose first: ask \"Why did this fail?\", check assumptions about paths, formats, and types, then record lessons in the documentation. In this way, AI can improve over time with persistent memory across sessions."
      - heading "Cultivating Your Personal AI" [level=3] [ref=f4e154]
      - paragraph [ref=f4e155]: As you collaborate more and more with AI, you'll accumulate tools, skills, and lessons. The system you interact with becomes more and more personalized.
      - paragraph [ref=f4e156]:
        - img "Three-layer architecture" [ref=f4e157]
      - paragraph [ref=f4e158]:
        - text: The figure shows a three-layer architecture. At the core sits the
        - strong [ref=f4e159]: LLM
        - text: —the same foundation model everyone uses. Wrapped around it is the
        - strong [ref=f4e160]: Agent System
        - text: (Cursor, Claude Code, Codex, etc.), which provides tools, memory, planning, and the feedback loop. The outermost layer is
        - strong [ref=f4e161]: your context
        - text: —the CLAUDE.md files, documentation, custom skills, and accumulated lessons that make the system uniquely yours. Even though everyone shares the same inner layers, the power you can unleash depends on your cultivation.
      - heading "The \"Center of Mass\" of Human-AI Collaboration" [level=2] [ref=f4e162]
      - paragraph [ref=f4e163]: In human-AI collaboration, the "center of mass" (CoM) can be different depending on the experiences of the user.
      - list [ref=f4e164]:
        - listitem [ref=f4e165]:
          - strong [ref=f4e166]: Novices
          - text: tend to let the AI lead. The center of knowledge sits with the AI, and the human follows.
        - listitem [ref=f4e167]:
          - strong [ref=f4e168]: Experienced researchers
          - text: maintain initiative. They direct the AI, and the center of mass stays with the human.
      - paragraph [ref=f4e169]:
        - text: This may cause a problem. The "10,000-hour rule" says that mastery requires 10,000 hours of deliberate practice. If novices always use AI to short-circuit the learning cycle, how can one gain experience, and therefore, intuition and taste? Or, are those hours still necessary in the age of AI agents? A thoughtful essay,
        - link "\"The Disappearing Apprentice\"" [ref=f4e170] [cursor=pointer]:
          - /url: https://mp.weixin.qq.com/s/XySs_pdwA7Nd7Sw28qujWA
        - text: ", argues that AI may block the pathway from novices to experts."
      - paragraph [ref=f4e171]:
        - text: The following
        - link "two suggestions" [ref=f4e172] [cursor=pointer]:
          - /url: https://youtu.be/iF9iV4xponk?t=1069
        - text: by Boris Cherny, the creator of Claude Code, on how to use the product may be relevant here. His first suggestion, surprisingly, is actually not to use Claude Code to write code. Instead, he suggests asking Claude Code to explain things to you. His second advice is to actively explore the boundaries of what AI can and cannot do
        - superscript [ref=f4e173]:
          - link "2" [ref=f4e174] [cursor=pointer]:
            - /url: "#footnote-2"
        - text: ". With that, you can divide tasks into three categories:"
      - list [ref=f4e175]:
        - listitem [ref=f4e176]:
          - strong [ref=f4e177]: Delegate entirely
          - text: ": routine tasks where AI handles everything"
        - listitem [ref=f4e178]:
          - strong [ref=f4e179]: Collaborate
          - text: ": tasks where you and AI work together"
        - listitem [ref=f4e180]:
          - strong [ref=f4e181]: Lead yourself
          - text: ": tasks too nuanced or novel for AI to handle alone"
      - paragraph [ref=f4e182]: It takes practice to gain the wisdom to know the difference between these categories. But only in this way can you freely control the CoM of human-AI collaboration and maximize your productivity. Perhaps that is where the next generation will spend their 10,000 hours!
      - heading "The Change" [level=2] [ref=f4e183]
      - paragraph [ref=f4e184]: "Computational research is changing rapidly. Here are some trends I and friends are observing:"
      - paragraph [ref=f4e185]:
        - strong [ref=f4e186]: "\"Code is cheap. Show me the idea.\""
        - text: The bottleneck in computational science is shifting from implementation to ideas and understanding. Code is becoming commodity—anyone can generate it. One of my favourite quotes by Richard Hamming is "The purpose of computing is insight, not numbers." His timeless advice about human insights becomes even more critical now. What matters is what he emphasized in
        - link "\"You and Your Research\"" [ref=f4e187] [cursor=pointer]:
          - /url: https://www.cs.virginia.edu/~robins/YouAndYourResearch.html
        - text: ":"
      - list [ref=f4e188]:
        - listitem [ref=f4e189]: Asking the right questions
        - listitem [ref=f4e190]: Knowing what to compute
        - listitem [ref=f4e191]: Understanding why it matters
        - listitem [ref=f4e192]: Interpreting the results of computation
      - paragraph [ref=f4e193]: This could be a golden age for those who are theoretically oriented and imaginative. Your analytical skills can provide valuable guidance to AI agents. In this way, AI agents do not replace rigorous scientific thinking—they expose it.
      - paragraph [ref=f4e194]:
        - strong [ref=f4e195]: The terminal is back.
        - text: The terminal is the oldest way humans interact with computers, and it's making a comeback. AI agents work naturally in terminal environments, where text commands flow seamlessly between human and machine. With direct access to files and programs in the terminal, there's no more copying and pasting from your dialog with a chatbot.
      - paragraph [ref=f4e196]:
        - strong [ref=f4e197]: The two-language problem is solved.
        - text: "We've long faced the \"two-language problem\" in scientific computing: a slow dynamic language for prototyping, a fast static language for production. Now, as Andrej Karpathy"
        - link "put it" [ref=f4e198] [cursor=pointer]:
          - /url: https://x.com/karpathy/status/1617979122625712128
        - text: ", \"The hottest new programming language is English.\" With natural language becoming the front-end that compiles down to optimized low-level code, the \"two-language problem\" is essentially solved. This has great implications for"
        - link "what to learn and build" [ref=f4e199] [cursor=pointer]:
          - /url: https://zenn.dev/h_shinaoka/articles/fcba75dc2e00a0
        - text: with current technology.
      - paragraph [ref=f4e200]:
        - strong [ref=f4e201]: Acknowledgments
      - paragraph [ref=f4e202]: Thanks to Jinguo Liu, Kun Chen, Linfeng Zhang, Hiroshi Shinaoka, Qi Yang, Zhendong Cao, and Ruisi Wang for discussions and sharing their perspectives.
