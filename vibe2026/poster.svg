<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1697" width="297mm" height="420mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap');
      text { font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1697" fill="#F5D800"/>

  <!-- AI Agent (top-left) -->
  <g transform="translate(40,120)" fill="none" stroke="#888" stroke-width="2.5" opacity="0.5">
    <!-- Head -->
    <rect x="20" y="0" width="40" height="35" rx="8" />
    <!-- Eyes -->
    <circle cx="33" cy="15" r="4" fill="#888" stroke="none"/>
    <circle cx="47" cy="15" r="4" fill="#888" stroke="none"/>
    <!-- Antenna -->
    <line x1="40" y1="0" x2="40" y2="-12"/>
    <circle cx="40" cy="-15" r="4" fill="#888" stroke="none"/>
    <!-- Mouth / speaker grille -->
    <line x1="30" y1="26" x2="50" y2="26"/>
    <!-- Body -->
    <rect x="22" y="40" width="36" height="30" rx="5"/>
    <!-- Arms -->
    <line x1="22" y1="48" x2="8" y2="58"/>
    <circle cx="5" cy="60" r="4"/>
    <line x1="58" y1="48" x2="72" y2="58"/>
    <circle cx="75" cy="60" r="4"/>
    <!-- Legs -->
    <line x1="32" y1="70" x2="28" y2="88"/>
    <line x1="48" y1="70" x2="52" y2="88"/>
    <!-- Signal waves from antenna -->
    <path d="M50,-10 Q56,-18 50,-26" stroke-width="1.5"/>
    <path d="M54,-8 Q62,-20 54,-32" stroke-width="1.5"/>
  </g>

  <!-- Experiment setup (top-right) -->
  <g transform="translate(1070,120)" fill="none" stroke="#888" stroke-width="2.5" opacity="0.5">
    <!-- Erlenmeyer flask -->
    <path d="M15,0 L15,25 L0,60 L40,60 L25,25 L25,0 Z" stroke-linejoin="round"/>
    <line x1="12" y1="0" x2="28" y2="0" stroke-linecap="round"/>
    <!-- Bubbles inside flask -->
    <circle cx="16" cy="45" r="3" fill="#888" stroke="none"/>
    <circle cx="24" cy="38" r="2" fill="#888" stroke="none"/>
    <circle cx="20" cy="50" r="2.5" fill="#888" stroke="none"/>
    <!-- Tube going right from flask top -->
    <path d="M25,8 Q38,8 38,20 Q38,30 55,30" stroke-linecap="round"/>
    <!-- Test tube on the right -->
    <rect x="55" y="22" width="12" height="38" rx="6"/>
    <line x1="55" y1="30" x2="67" y2="30" stroke-width="1.5"/>
    <!-- Liquid level in test tube -->
    <rect x="57" y="40" width="8" height="16" rx="4" fill="#888" stroke="none" opacity="0.4"/>
    <!-- Stand / base -->
    <line x1="72" y1="10" x2="72" y2="65"/>
    <line x1="62" y1="65" x2="82" y2="65"/>
    <line x1="72" y1="25" x2="58" y2="25" stroke-width="1.5"/>
    <!-- Steam/vapor from flask -->
    <path d="M18,-5 Q15,-15 20,-20" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M24,-5 Q27,-18 22,-25" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" font-size="78" font-weight="900" fill="#1a1a1a" letter-spacing="6">Agentic AI in Action!</text>
  <!-- Date & Location -->
  <rect x="230" y="123" width="740" height="64" rx="32" fill="#1a1a1a"/>
  <text x="600" y="163" text-anchor="middle" font-size="28" font-weight="700" fill="#F5D800" letter-spacing="1">2026年4月14日  |  中国科学院物理研究所 M234</text>

  <!-- Divider line -->
  <line x1="60" y1="285" x2="1140" y2="285" stroke="#1a1a1a" stroke-width="3"/>

  <!-- LEFT COLUMN: Speakers -->
  <text x="300" y="345" text-anchor="middle" font-size="40" font-weight="900" fill="#1a1a1a" letter-spacing="8">演 讲 嘉 宾</text>
  <line x1="165" y1="367" x2="435" y2="367" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Speaker 1: 戴希 -->
  <text x="80" y="427" font-size="32" font-weight="900" fill="#1a1a1a">戴希</text>
  <text x="80" y="462" font-size="20" font-weight="500" fill="#333">我和agent完成的第一个项目</text>
  <text x="80" y="487" font-size="17" font-weight="600" fill="#777" letter-spacing="1">09:00 – 09:30</text>

  <!-- Speaker 2: 李源 -->
  <text x="80" y="530" font-size="32" font-weight="900" fill="#1a1a1a">李源</text>
  <text x="80" y="565" font-size="20" font-weight="500" fill="#333">人工智能体与实验型研究：一些打开方式</text>
  <text x="80" y="590" font-size="17" font-weight="600" fill="#777" letter-spacing="1">09:30 – 10:00</text>

  <!-- Speaker 3: 张士欣 -->
  <text x="80" y="635" font-size="32" font-weight="900" fill="#1a1a1a">张士欣</text>
  <text x="80" y="670" font-size="20" font-weight="500" fill="#333">Leveraging TensorCircuit-NG for Agentic</text>
  <text x="80" y="695" font-size="20" font-weight="500" fill="#333">Development and Automated Research</text>
  <text x="80" y="720" font-size="17" font-weight="600" fill="#777" letter-spacing="1">10:20 – 10:50</text>

  <!-- Speaker 4: 周毅 -->
  <text x="80" y="765" font-size="32" font-weight="900" fill="#1a1a1a">周毅</text>
  <text x="80" y="800" font-size="20" font-weight="500" fill="#333">从文献到实现：基于大语言模型的</text>
  <text x="80" y="825" font-size="20" font-weight="500" fill="#333">量子多体算法实现工作流全记录</text>
  <text x="80" y="850" font-size="17" font-weight="600" fill="#777" letter-spacing="1">14:00 – 14:30</text>

  <!-- Speaker 5: 刘金国 -->
  <text x="80" y="895" font-size="32" font-weight="900" fill="#1a1a1a">刘金国</text>
  <text x="80" y="930" font-size="20" font-weight="500" fill="#333">Live demo: Vibe coding done right</text>
  <text x="80" y="955" font-size="17" font-weight="600" fill="#777" letter-spacing="1">14:30 – 15:30</text>

  <!-- Speaker 6: 张天汉、廖若雪 -->
  <text x="80" y="1000" font-size="32" font-weight="900" fill="#1a1a1a">张天汉、廖若雪</text>
  <text x="80" y="1035" font-size="20" font-weight="500" fill="#333">Agentic Infra for Science and</text>
  <text x="80" y="1060" font-size="20" font-weight="500" fill="#333">Agent-Ready Manuscript</text>
  <text x="80" y="1085" font-size="17" font-weight="600" fill="#777" letter-spacing="1">15:50 – 16:20</text>

  <!-- Speaker 7: 陈锟 -->
  <text x="80" y="1130" font-size="32" font-weight="900" fill="#1a1a1a">陈锟</text>
  <text x="80" y="1165" font-size="20" font-weight="500" fill="#333">自然科学的形式化与科研的自动化</text>
  <text x="80" y="1190" font-size="17" font-weight="600" fill="#777" letter-spacing="1">16:20 – 16:50</text>

  <!-- Speaker 8: 涂佳敏 -->
  <text x="80" y="1235" font-size="32" font-weight="900" fill="#1a1a1a">涂佳敏</text>
  <text x="80" y="1270" font-size="20" font-weight="500" fill="#333">实验数据分析的新手入门加速</text>
  <text x="80" y="1295" font-size="17" font-weight="600" fill="#777" letter-spacing="1">16:50 – 17:05</text>

  <!-- Speaker 9: 柴声都 -->
  <text x="80" y="1340" font-size="32" font-weight="900" fill="#1a1a1a">柴声都</text>
  <text x="80" y="1375" font-size="20" font-weight="500" fill="#333">与 Claude Code 协作：构建自动化</text>
  <text x="80" y="1400" font-size="20" font-weight="500" fill="#333">科研工作流的初步探索</text>
  <text x="80" y="1425" font-size="17" font-weight="600" fill="#777" letter-spacing="1">17:05 – 17:20</text>

  <!-- Speaker 10: 欧仕刚 -->
  <text x="80" y="1470" font-size="32" font-weight="900" fill="#1a1a1a">欧仕刚</text>
  <text x="80" y="1505" font-size="20" font-weight="500" fill="#333">Benchmark, Simulator &amp; Calibration：</text>
  <text x="80" y="1530" font-size="20" font-weight="500" fill="#333">降低idea验证成本的探索</text>
  <text x="80" y="1555" font-size="17" font-weight="600" fill="#777" letter-spacing="1">17:20 – 17:35</text>

  <!-- Vertical divider -->
  <line x1="580" y1="305" x2="580" y2="1580" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- RIGHT COLUMN: Discussion Topics -->
  <text x="880" y="345" text-anchor="middle" font-size="40" font-weight="900" fill="#1a1a1a" letter-spacing="8">讨 论 话 题</text>
  <line x1="745" y1="367" x2="1015" y2="367" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Topic list -->
  <g font-size="22" fill="#1a1a1a">
    <!-- Topic 1: experiments — flask -->
    <g transform="translate(630,425)">
      <path d="M6,0 L6,8 L0,22 L18,22 L12,8 L12,0 Z" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="4" y1="0" x2="14" y2="0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="670" y="446" font-size="22" fill="#1a1a1a">Agentic AI 对实验有用吗？</text>

    <!-- Topic 2: papers & legacy — document icon -->
    <g transform="translate(630,487)">
      <rect x="0" y="0" width="16" height="22" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="4" y1="7" x2="12" y2="7" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="4" y1="11" x2="12" y2="11" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="4" y1="15" x2="9" y2="15" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
    <text x="670" y="507" font-size="22" fill="#1a1a1a">Agentic AI 时代，</text>
    <text x="670" y="534" font-size="22" fill="#1a1a1a">什么样的工作能留下来？</text>

    <!-- Topic 3: AI skills vs human learning — graduation cap -->
    <g transform="translate(630,568)">
      <polygon points="8,0 0,8 8,16 16,8" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="16" y1="8" x2="16" y2="18" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <text x="670" y="588" font-size="22" fill="#1a1a1a">AI掌握的技能</text>
    <text x="670" y="615" font-size="22" fill="#1a1a1a">研究人员还需要学习吗？</text>

    <!-- Topic 4: coding tools — terminal bracket -->
    <g transform="translate(630,650)">
      <rect x="0" y="0" width="22" height="18" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <polyline points="4,6 8,10 4,14" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="11" y1="14" x2="17" y2="14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="670" y="670" font-size="22" fill="#1a1a1a">Cursor, Claude Code, CodeX</text>
    <text x="670" y="697" font-size="22" fill="#1a1a1a">哪一个好？</text>

    <!-- Topic 5: future of research — compass -->
    <g transform="translate(630,732)">
      <circle cx="10" cy="10" r="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <polygon points="10,2 7,10 10,18 13,10" fill="#1a1a1a"/>
    </g>
    <text x="670" y="752" font-size="22" fill="#1a1a1a">在agentic AI越来越强的</text>
    <text x="670" y="779" font-size="22" fill="#1a1a1a">如今，该怎么做科研</text>

    <!-- Topic 6: intuition vs AI — head with spark -->
    <g transform="translate(630,814)">
      <circle cx="10" cy="8" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M6,20 Q10,14 14,20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M10,3 L11,6 L14,5 L12,8" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="670" y="834" font-size="22" fill="#1a1a1a">对AI的依赖是否会影响</text>
    <text x="670" y="861" font-size="22" fill="#1a1a1a">研究人员科研直觉的建立？</text>

    <!-- Topic 7: correctness — checkmark in circle -->
    <g transform="translate(630,896)">
      <circle cx="10" cy="10" r="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <polyline points="5,10 9,15 16,5" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="670" y="916" font-size="22" fill="#1a1a1a">怎么保证AI做的结果是对的？</text>

    <!-- Topic 8: beyond coding — arrow breaking out -->
    <g transform="translate(630,958)">
      <rect x="0" y="4" width="14" height="16" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="8" y1="12" x2="22" y2="0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <polyline points="16,0 22,0 22,6" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="670" y="978" font-size="22" fill="#1a1a1a">Agentic AI 除了编程</text>
    <text x="670" y="1005" font-size="22" fill="#1a1a1a">还能干什么？</text>

    <!-- Topic 9: OpenClaw — claw bot -->
    <g transform="translate(630,1040)">
      <rect x="4" y="10" width="16" height="12" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="9" cy="15" r="1.5" fill="#1a1a1a"/>
      <circle cx="15" cy="15" r="1.5" fill="#1a1a1a"/>
      <path d="M2,10 L2,4 Q2,0 6,2" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <path d="M22,10 L22,4 Q22,0 18,2" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="22" x2="5" y2="27" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="22" x2="19" y2="27" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="670" y="1060" font-size="22" fill="#1a1a1a">OpenClaw对科研有用吗？</text>

    <!-- Topic 10: multitasking — grid of dots -->
    <g transform="translate(630,1100)">
      <circle cx="3" cy="3" r="3" fill="#1a1a1a"/>
      <circle cx="12" cy="3" r="3" fill="#1a1a1a"/>
      <circle cx="21" cy="3" r="3" fill="#1a1a1a"/>
      <circle cx="3" cy="12" r="3" fill="#1a1a1a"/>
      <circle cx="12" cy="12" r="3" fill="#1a1a1a"/>
      <circle cx="21" cy="12" r="3" fill="#1a1a1a"/>
    </g>
    <text x="670" y="1120" font-size="22" fill="#1a1a1a">如何让大脑适应多Agents/</text>
    <text x="670" y="1147" font-size="22" fill="#1a1a1a">多项目并行的工作模式?</text>
  </g>

  <!-- QR Code section -->
  <rect x="660" y="1185" width="460" height="330" rx="20" fill="#fff" opacity="0.3"/>

  <text x="890" y="1228" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a1a">你有什么问题？</text>
  <text x="890" y="1262" text-anchor="middle" font-size="20" font-weight="500" fill="#444">扫码提交/选出你的问题</text>

  <!-- QR Code embed (centered: 890 - 100 = 790) -->
  <image x="790" y="1278" width="200" height="200" href="data:image/png;base64,"/>

  <!-- Bottom divider -->
  <line x1="60" y1="1590" x2="1140" y2="1590" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Decorative bottom bar -->
  <rect x="0" y="1657" width="1200" height="40" fill="#1a1a1a"/>
  <text x="600" y="1685" text-anchor="middle" font-size="20" font-weight="700" fill="#F5D800" letter-spacing="2">wangleiphy.github.io/vibe2026</text>

</svg>
