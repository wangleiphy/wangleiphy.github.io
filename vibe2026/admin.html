<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
   <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Topic Review</title>
    <link href="css/general.css" rel="stylesheet" type="text/css"/>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
      .admin-btn { padding:5px 14px; font-size:13px; font-family:Helvetica; border:none; border-radius:4px; cursor:pointer; color:white; }
      .admin-btn.approve { background:#2e8b57; }
      .admin-btn.approve:hover { background:#256e46; }
      .admin-btn.reject { background:#c44; }
      .admin-btn.reject:hover { background:#a33; }
    </style>
  </head>
  <body>
    <div style="text-align:center;">
      <h1>Topic Review</h1>
      <hr>

      <div class="topics-container">
        <h2>Pending</h2>
        <div id="pending-list"></div>
        <p id="pending-empty" style="color:#999; font-style:italic; display:none;">No pending topics.</p>

        <hr style="margin:30px 0;">

        <h2>Approved</h2>
        <div id="approved-list"></div>
        <p id="approved-empty" style="color:#999; font-style:italic; display:none;">No approved topics.</p>
      </div>
    </div>

    <script>
      firebase.initializeApp({
        apiKey: "AIzaSyBoXa3ZxUSvtcU7DSQey_Lq5DzETVTA2-o",
        authDomain: "vibe2026-c118f.firebaseapp.com",
        databaseURL: "https://vibe2026-c118f-default-rtdb.firebaseio.com",
        projectId: "vibe2026-c118f",
        storageBucket: "vibe2026-c118f.firebasestorage.app",
        messagingSenderId: "760367604455",
        appId: "1:760367604455:web:50fa1fbcd91981bb93f842"
      });
      var db = firebase.database();
      var pendingRef = db.ref('pending');
      var topicsRef = db.ref('topics');

      function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

      function approve(id) {
        pendingRef.child(id).once('value', function(s) {
          var d = s.val();
          if (d) { topicsRef.push(d); pendingRef.child(id).remove(); }
        });
      }
      function reject(id) { pendingRef.child(id).remove(); }
      function removeApproved(id) { topicsRef.child(id).remove(); }

      pendingRef.on('value', function(snap) {
        var list = document.getElementById('pending-list');
        var empty = document.getElementById('pending-empty');
        var data = snap.val();
        if (!data) { list.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        var items = Object.entries(data).map(function(e) { return {id:e[0], text:e[1].text, time:e[1].time}; })
          .sort(function(a,b) { return a.time - b.time; });
        list.innerHTML = items.map(function(t) {
          return '<div class="topic-item">' +
            '<span class="topic-text">' + escapeHtml(t.text) + '</span>' +
            '<button class="admin-btn approve" onclick="approve(\'' + t.id + '\')">Approve</button> ' +
            '<button class="admin-btn reject" onclick="reject(\'' + t.id + '\')">Reject</button>' +
            '</div>';
        }).join('');
      });

      topicsRef.on('value', function(snap) {
        var list = document.getElementById('approved-list');
        var empty = document.getElementById('approved-empty');
        var data = snap.val();
        if (!data) { list.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        var items = Object.entries(data).map(function(e) { return {id:e[0], text:e[1].text, votes:e[1].votes, time:e[1].time}; })
          .sort(function(a,b) { return b.votes - a.votes || a.time - b.time; });
        list.innerHTML = items.map(function(t) {
          return '<div class="topic-item">' +
            '<span style="min-width:30px;text-align:center;color:#00688B;font-weight:bold;">' + t.votes + '</span>' +
            '<span class="topic-text">' + escapeHtml(t.text) + '</span>' +
            '<button class="admin-btn reject" onclick="removeApproved(\'' + t.id + '\')">Remove</button>' +
            '</div>';
        }).join('');
      });
    </script>
  </body>
</html>
