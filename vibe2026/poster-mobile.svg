  <text x="60" y="850" font-size="26" font-weight="700" fill="#222">刘金国</text>
  <text x="690" y="850" text-anchor="end" font-size="18" fill="#444">14:30-15:30</text>
  <text x="60" y="880" font-size="18" fill="#555">Live demo: Vibe coding done right</text>

