    <text x="75" y="1594" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">2</text>
    <text x="100" y="1595" font-size="22">Agentic AI 时代，什么样的工作能留下来？</text>

    <circle cx="75" cy="1638" r="14" fill="#222"/>
    <text x="75" y="1644" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">3</text>
    <text x="100" y="1645" font-size="22">AI掌握的技能研究人员还需要学习吗？</text>

