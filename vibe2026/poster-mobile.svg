    <text x="75" y="1744" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">5</text>
    <text x="100" y="1745" font-size="22">在agentic AI越来越强的如今，该怎么做科研</text>

    <circle cx="75" cy="1788" r="14" fill="#222"/>
    <text x="75" y="1794" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">6</text>
    <text x="100" y="1795" font-size="22">对AI的依赖是否会影响科研直觉的建立？</text>

    <circle cx="75" cy="1838" r="14" fill="#222"/>
    <text x="75" y="1844" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">7</text>
    <text x="100" y="1845" font-size="22">怎么保证AI做的结果是对的？</text>

    <circle cx="75" cy="1888" r="14" fill="#222"/>
    <text x="75" y="1894" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">8</text>
    <text x="100" y="1895" font-size="22">Agentic AI 除了编程还能干什么？</text>

    <circle cx="75" cy="1938" r="14" fill="#222"/>
    <text x="75" y="1944" text-anchor="middle" font-size="16" font-weight="700" fill="#F5D800">9</text>
    <text x="100" y="1945" font-size="22">OpenClaw对科研有用吗？</text>

    <circle cx="75" cy="1988" r="14" fill="#222"/>
    <text x="75" y="1994" text-anchor="middle" font-size="14" font-weight="700" fill="#F5D800">10</text>
    <text x="100" y="1995" font-size="22">如何适应多Agents/多项目并行的工作模式?</text>
