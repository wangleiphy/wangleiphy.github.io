<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Teaching Material by Lei Wang">
    <title>Teaching - Lei Wang</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="css/modern-style.css" rel="stylesheet">
    <!-- Marked.js for Markdown parsing (self-hosted: CDNs are unreachable from WeChat/mainland browsers) -->
    <script src="js/vendor/marked.min.js"></script>
    <!-- Footnote support for marked.js -->
    <script src="js/vendor/marked-footnote.umd.min.js"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="js/vendor/katex/katex.min.css">
    <script defer src="js/vendor/katex/katex.min.js"></script>
    <script defer src="js/vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
    <header>
        <div class="hero">
            <h1>Writings</h1>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="writings.html">Writings</a>
                <a href="talks.html">Talks</a>
                <a href="conferences.html">Events</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container-narrow">
            <div id="markdown-content"></div>
        </div>
    </main>

    <footer>
        <p>&copy; Lei Wang. All rights reserved.</p>
    </footer>

    <script>
    // Teaching post viewer - renders markdown from ?p= query parameter
    async function loadPost() {
        const container = document.getElementById('markdown-content');
        const params = new URLSearchParams(window.location.search);
        const postName = params.get('p');

        if (!postName) {
            container.innerHTML = '<p>No material specified. <a href="writings.html">View all writings</a></p>';
            return;
        }

        // Wait for marked.js
        let attempts = 0;
        while (!window.marked && attempts < 50) {
            await new Promise(resolve => setTimeout(resolve, 100));
            attempts++;
        }

        if (!window.marked) {
            container.innerHTML = '<p>Error: Markdown parser not loaded.</p>';
            return;
        }

        // Configure marked with footnote extension
        if (window.markedFootnote) {
            marked.use(markedFootnote());
        }

        try {
            container.innerHTML = '<div class="loading">Loading content...</div>';

            const response = await fetch(`content/teaching/${postName}.md`);
            if (!response.ok) {
                throw new Error(`Material not found: ${postName}`);
            }

            const markdown = await response.text();

            // Protect math spans from markdown processing (marked would otherwise
            // interpret underscores inside $...$ as italic delimiters).
            const mathBlocks = [];
            let protectedMd = markdown.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => {
                mathBlocks.push({delim: '$$', content: m});
                return `@@MATHBLOCK${mathBlocks.length - 1}@@`;
            });
            protectedMd = protectedMd.replace(/\$([^\$\n]+?)\$/g, (_, m) => {
                mathBlocks.push({delim: '$', content: m});
                return `@@MATHBLOCK${mathBlocks.length - 1}@@`;
            });

            let html = marked.parse(protectedMd);
            html = html.replace(/@@MATHBLOCK(\d+)@@/g, (_, i) => {
                const b = mathBlocks[+i];
                // HTML-escape math content so the browser does not parse e.g. <i as a tag;
                // it will unescape to text nodes before KaTeX walks the DOM.
                const escaped = b.content
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                return `${b.delim}${escaped}${b.delim}`;
            });

            container.style.opacity = '0';
            container.innerHTML = html;

            // Update page title from first h1
            const h1 = container.querySelector('h1');
            if (h1) {
                document.title = h1.textContent + ' - Lei Wang';
            }

            // Make external links open in new tab
            container.querySelectorAll('a[href^="http"]').forEach(link => {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });

            // Fix image paths (relative to markdown file -> relative to HTML)
            container.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src');
                if (src && !src.startsWith('http') && !src.startsWith('/') && !src.startsWith('content/')) {
                    img.setAttribute('src', `content/teaching/${src}`);
                }
            });

            // Render math with KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }

            setTimeout(() => {
                container.style.transition = 'opacity 0.3s ease';
                container.style.opacity = '1';
            }, 10);

        } catch (error) {
            container.innerHTML = `
                <div class="error-message">
                    <h2>Error Loading Material</h2>
                    <p>${error.message}</p>
                    <p><a href="writings.html">← Back to writings</a></p>
                </div>
            `;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadPost);
    } else {
        loadPost();
    }
    </script>
</body>
</html>
